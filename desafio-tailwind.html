<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- 
  Comparação de Abordagens:
  - Mais classes no HTML: A abordagem utility-first (Tailwind) exigiu mais classes diretamente no HTML (bg-violet-600, text-white, px-4, py-2, rounded-lg, etc.), enquanto o Bootstrap resumiu tudo em poucas classes de componentes (btn btn-primary).
  - Mais fácil de customizar depois: O Tailwind é mais fácil de customizar para elementos específicos, pois você ajusta as cores, espaçamentos e bordas direto no HTML sem precisar escrever CSS customizado ou sobrescrever estilos pré-existentes.-->
    <button type="button" class="bg-violet-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-violet-700">Ver Produtos</button>
  </body>
</html>
